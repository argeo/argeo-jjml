name: JJML Release

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches: [ "unstable" ]
    tags:
    - '*'
  pull_request:
    branches: [ "testing", "unstable" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:

##
## WINDOWS
##
  windows-x86_64:
    runs-on: windows-2025
    if: false

    steps:
    - uses: actions/checkout@v4
      name: Clone recursively with tags
      with:
        submodules: 'true'
        fetch-depth: '0'
        fetch-tags: 'true'

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}\argeo-jjml" >> "$GITHUB_OUTPUT"
        echo "${{ github.workspace }}\a2\lib\x86_64-windows-std\org.argeo.tp.ggml" >> $GITHUB_PATH

    - uses: actions/setup-java@v5
      name: Setup Java
      with:
        distribution: 'semeru'
        java-version: 21

    - name: libCURL
      id: get_libcurl
      uses: ./.github/actions/windows-setup-curl
      with:
        architecture: win64

    - name: ccache
      uses: ggml-org/ccache-action@v1.2.16
      with:
        key: windows-x86_64
        evict-old-files: 1d

    - name: Configure CMake
      env:
        CURL_PATH: ${{ steps.get_libcurl.outputs.curl_path }}
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DJAVA_HOME=%JAVA_HOME%
        -DCMAKE_SKIP_BUILD_RPATH=ON
        -DJJML_FORCE_BUILD_TP=ON
        -DA2_INSTALL_MODE=a2
        -DGGML_CCACHE=ON
        -DLLAMA_CURL=OFF
        -DCURL_LIBRARY="$env:CURL_PATH/lib/libcurl.dll.a" -DCURL_INCLUDE_DIR="$env:CURL_PATH/include"
        -DLLAMA_BUILD_COMMON=ON
        -DLLAMA_BUILD_TOOLS=ON
        -DLLAMA_BUILD_EXAMPLES=OFF
        -DLLAMA_BUILD_TESTS=OFF
        -DGGML_BACKEND_DL=ON
        -DGGML_CPU_ALL_VARIANTS=ON
        -DGGML_VULKAN=OFF
        -DGGML_BLAS=OFF
        -S ${{ github.workspace }}

    - name: Build
      env:
        CURL_PATH: ${{ steps.get_libcurl.outputs.curl_path }}
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release -j $(nproc)

    - name: Test
      run: >
        java -ea
        "-Djava.library.path=${{ github.workspace }}\a2\lib\x86_64-windows-std\org.argeo.jjml;${{ github.workspace }}\a2\lib\x86_64-windows-std\org.argeo.tp.ggml"
        "--module-path=${{ github.workspace }}\a2\lib\org.argeo.jjml"
        --add-modules org.argeo.jjml
        sdk/jbin/JjmlSmokeTests.java

    - name: Create JDK
      run: |
        gmake -f tooling.mk jdk-jjml

    - name: Create JDK .msi
      run: |
        gmake -f tooling.mk msi-jdk-jjml

    - name: Test JJML JDK
      shell: cmd
      run: >
        "${{ github.workspace }}\argeo-jjml\jdk-jjml-21-openj9-x86_64-windows-std\bin\java" -ea
        "${{ github.workspace }}\argeo-jjml\jdk-jjml-21-openj9-x86_64-windows-std\man\examples\JjmlSmokeTests.java"
        allenai/OLMo-2-0425-1B-Instruct-GGUF

    - name: Release
      uses: ncipollo/release-action@v1
      continue-on-error: true
      with:
        # Windows x86_64 is reference for portable jmod
        artifacts: "${{ github.workspace }}/argeo-jjml/jdk-jjml-21-openj9-*.msi,${{ github.workspace }}/argeo-jjml/jdk-jjml-21-openj9-*/jmods/*-windows-*org.argeo.*.jmod"
        allowUpdates: true
        artifactErrorsFailBuild: true
        draft: true
        omitBody: true

    - name: Test llama-cli
      continue-on-error: true
      shell: cmd
      run: >
        "${{ github.workspace }}\argeo-jjml\jdk-jjml-21-openj9-x86_64-windows-std\bin\llama-cli"
        --no-conversation
        --model "%LOCALAPPDATA%\llama.cpp\allenai_OLMo-2-0425-1B-Instruct-GGUF_OLMo-2-0425-1B-Instruct-Q4_K_M.gguf"
        --prompt "Describe the Java programming language in two sentences."


##
## MACOS
##
  macos-aarch64:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4
      name: Clone recursively with tags
      with:
        submodules: 'true'
        fetch-depth: '0'
        fetch-tags: 'true'

    - name: Prepare A2 output
      run: |
        mkdir -p ${{ github.workspace }}/a2/lib/aarch64-macos-std/jmods
        cd ${{ github.workspace }}/a2/lib && ln -s aarch64-macos-std local

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/argeo-jjml" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-java@v5
      name: Setup Java
      with:
        distribution: 'semeru'
        java-version: 21

    - name: ccache
      uses: ggml-org/ccache-action@v1.2.16
      with:
        key: macos-arm64
        evict-old-files: 1d

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DJAVA_HOME=$JAVA_HOME
        -DJJML_FORCE_BUILD_TP=ON
        -DA2_INSTALL_MODE=a2
        -DCMAKE_SKIP_BUILD_RPATH=ON
        -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
        -DGGML_CPU_ARM_ARCH=armv8.4-a
        -DGGML_NATIVE=OFF
        -DGGML_CCACHE=ON
        -DGGML_METAL_USE_BF16=ON
        -DGGML_METAL_EMBED_LIBRARY=ON
        -DLLAMA_CURL=OFF
        -DLLAMA_BUILD_COMMON=ON
        -DLLAMA_BUILD_TOOLS=ON
        -DLLAMA_BUILD_EXAMPLES=OFF
        -DLLAMA_BUILD_TESTS=OFF
        -DBUILD_SHARED_LIBS=ON
        -DGGML_BACKEND_DL=OFF
        -DGGML_CPU_ALL_VARIANTS=OFF
        -DGGML_VULKAN=OFF
        -DGGML_BLAS=OFF
        -DGGML_METAL=OFF
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release -j $(sysctl -n hw.logicalcpu)

    - name: Test
      run: >
        DYLD_LIBRARY_PATH=${{ github.workspace }}/a2/lib/local/org.argeo.tp.ggml
        java -ea
        "-Djava.library.path=${{ github.workspace }}/a2/lib/local/org.argeo.jjml"
        "--module-path=${{ github.workspace }}/a2/lib/org.argeo.jjml"
        --add-modules org.argeo.jjml
        sdk/jbin/JjmlSmokeTests.java

    - name: GNU Make installation
      run: |
        brew install make

    - name: Create JDK
      run: |
        gmake -f tooling.mk jdk-jjml
        cd ${{ github.workspace }}/argeo-jjml && ln -s jdk-jjml-21-openj9-aarch64-macos-std jdk-jjml-21-openj9

        chmod +x ${{ github.workspace }}/argeo-jjml/jdk-jjml-21-openj9/lib/llama-cli
        chmod +x ${{ github.workspace }}/argeo-jjml/jdk-jjml-21-openj9/lib/llama-bench
        
        # Make sure build artifacts won't be loaded during tests
        #rm -rf ${{ github.workspace }}/a2

    - name: Create JDK .pkg
      run: |
        gmake -f tooling.mk pkg-jdk-jjml

    - name: Test JDK .pkg installation
      run: |
        gmake -f tooling.mk install-pkg-jdk-jjml

    - name: Test JJML JDK
      run: >
        /Library/Java/JavaVirtualMachines/jdk-jjml-21-openj9/Contents/Home/bin/java -ea
        /Library/Java/JavaVirtualMachines/jdk-jjml-21-openj9/Contents/Home/man/examples/JjmlSmokeTests.java
        allenai/OLMo-2-0425-1B-Instruct-GGUF

    - name: Release
      uses: ncipollo/release-action@v1
      continue-on-error: true
      with:
        artifacts: "${{ github.workspace }}/argeo-jjml/jdk-jjml-21-openj9-*.pkg,${{ github.workspace }}/argeo-jjml/jdk-jjml-21-openj9-*/jmods/*org.argeo.*.jmod"
        allowUpdates: true
        artifactErrorsFailBuild: true
        draft: true
        omitBody: true

    - name: Test llama-cli
      run: >
        DYLD_LIBRARY_PATH=/Library/Java/JavaVirtualMachines/jdk-jjml-21-openj9/Contents/Home/lib
        /Library/Java/JavaVirtualMachines/jdk-jjml-21-openj9/Contents/Home/lib/llama-cli
        --no-conversation
        --model /Users/runner/Library/Caches/llama.cpp/allenai_OLMo-2-0425-1B-Instruct-GGUF_OLMo-2-0425-1B-Instruct-Q4_K_M.gguf
        --prompt "Describe the Java programming language in two sentences."


